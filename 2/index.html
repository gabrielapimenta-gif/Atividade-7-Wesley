<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Aritmética</title>
    <link rel="stylesheet" href="assets/estilo.css">
</head>
<body>
    <div class="container">
        <h2>Cálculo de Média</h2>
        
        <div class="input-area">
            <input type="number" id="numInput" placeholder="Digite um valor">
            <button onclick="adicionarValor()">Adicionar</button>
        </div>

        <div id="painelDados" class="hidden">
            <div class="info-box">
                <p><strong>Total de números:</strong> <span id="contagem">0</span></p>
                <p><strong>Números:</strong> <span id="listaNumeros"></span></p>
            </div>
            <button class="btn-calcular" onclick="mostrarMedia()">Calcular Média Final</button>
        </div>

        <div id="resultado" class="hidden">
            <h3>A média aritmética é: <span id="mediaFinal"></span></h3>
            <button class="btn-reset" onclick="reiniciar()">Reiniciar</button>
        </div>
    </div>
    <script src="assets/funcionalidade.js"></script>
</body>
</html>
